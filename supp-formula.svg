<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 978 236" width="978" height="236" role="img" aria-label="Supplemental tax formula: $765,000 minus $420,000 equals $345,000, times 1.0831 percent is $3,737 a year, times 0.50 for a December closing is $1,868"><title>Supplemental tax formula: $765,000 minus $420,000 equals $345,000, times 1.0831 percent is $3,737 a year, times 0.50 for a December closing is $1,868</title><rect width="978" height="236" fill="#fff"/><text x="24" y="40" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#222223" text-anchor="start">How the supplemental bill is figured</text><text x="24" y="66" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5E5E60" text-anchor="start">Folsom example: $765,000 home, north of Hwy 50, December closing</text><rect x="24" y="90" width="170" height="90" rx="12" fill="#F0F0F0"/><text x="109.0" y="120" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#5E5E60" text-anchor="middle">Your price</text><text x="109.0" y="156" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#222223" text-anchor="middle">$765,000</text><rect x="214" y="90" width="170" height="90" rx="12" fill="#F0F0F0"/><text x="299.0" y="120" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#5E5E60" text-anchor="middle">Seller&#x27;s value</text><text x="299.0" y="156" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#222223" text-anchor="middle">$420,000</text><rect x="404" y="90" width="170" height="90" rx="12" fill="#F0F0F0"/><text x="489.0" y="120" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#5E5E60" text-anchor="middle">Gap</text><text x="489.0" y="156" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#222223" text-anchor="middle">$345,000</text><rect x="594" y="90" width="170" height="90" rx="12" fill="#F0F0F0"/><text x="679.0" y="120" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#5E5E60" text-anchor="middle">x tax rate 1.0831%</text><text x="679.0" y="156" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#222223" text-anchor="middle">$3,737/yr</text><rect x="784" y="90" width="170" height="90" rx="12" fill="#222223"/><text x="869.0" y="120" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#E6E6E6" text-anchor="middle">x December 0.50</text><text x="869.0" y="156" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#ffea27" text-anchor="middle">$1,868</text><text x="204" y="145" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#5E5E60" text-anchor="middle">−</text><text x="394" y="145" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#5E5E60" text-anchor="middle">=</text><text x="584" y="145" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#5E5E60" text-anchor="middle">→</text><text x="774" y="145" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#5E5E60" text-anchor="middle">→</text><text x="24" y="218" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5E5E60" text-anchor="start">Formula and monthly factor: Sacramento County Assessor. Rate: 2026-27 Folsom county bills. Seller&#x27;s value is an example.</text></svg>